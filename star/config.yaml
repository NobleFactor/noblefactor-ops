# star.yaml - Unified quality gate configuration
# This file is the single source of truth for all linting and quality checks.

lint:
  go:
    path: "./..."
  shell:
    path: "."
    severity: warning
    indent: 4
  markdown:
    path: "."
    exclude:
      - "vendor/**"
      - "node_modules/**"
    frontmatter:
      required:
        - title
        - description
    config:
      # Disable rules that conflict with our style
      MD013: false  # Line length - too restrictive for documentation
      MD025:        # Single h1 - configure to ignore frontmatter title
        front_matter_title: ""
      MD029: false  # Ordered list prefix - we use explicit numbers for reference
      MD033: false  # Inline HTML - needed for badges and advanced formatting
      MD041: false  # First line h1 - conflicts with frontmatter
  go_style:
    comment_schemas:
      func_doc:
        format: go
        node_type: FuncDecl
        elements:
          - name: summary
            production: item
            consumes: "Paragraph / Heading"
            prefix: "{name}"
            split: sentence
            required: "true"
            order: 1
          - name: body
            production: item
            consumes: "*(Paragraph / Code / Heading)"
            order: 2
          - name: parameters
            production: list
            header: "Parameters:"
            condition: params
            required: if_condition
            slots: params
            slot_prefix: "{slot}"
            order: 3
          - name: returns
            production: list
            header: "Returns:"
            condition: returns
            required: if_condition
            slots: returns
            slot_prefix: "{slot}"
            order: 4
          - name: directives
            production: item
            consumes: "*Paragraph"
            prefix: "+"
            order: 5
      delineator:
        format: go
        node_type: Delineator
        elements:
          - name: content
            production: nil
            consumes: "*(Paragraph / Code / Heading / List)"
            order: 1
  copyright:
    enabled: true
    license: MIT
    holder: Noble Factor
    patterns:
      go:
        match: '// SPDX-License-Identifier: \S+\s*\n// Copyright.*All rights reserved\.'
        replace: |
          // SPDX-License-Identifier: {license}
          // Copyright {holder}. All rights reserved.
      star:
        match: '# SPDX-License-Identifier: \S+\s*\n# Copyright.*All rights reserved\.'
        replace: |
          # SPDX-License-Identifier: {license}
          # Copyright {holder}. All rights reserved.
      shell:
        match: '# SPDX-License-Identifier: \S+\s*\n# Copyright.*All rights reserved\.'
        replace: |
          # SPDX-License-Identifier: {license}
          # Copyright {holder}. All rights reserved.
    exclude:
      - "**/testdata/**"
      - "**/vendor/**"
      - "**/*_generated.go"

# Pre-commit hook generation
# Running `star setup config` generates .pre-commit-config.yaml from this.
precommit:
  hooks:
    - id: star-lint-all
      name: Star quality gate
      entry: star lint all --
      language: system
      pass_filenames: true
      types:
        - file
