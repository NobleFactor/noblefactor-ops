extension: com.noblefactor.star.LintShell
description: Run shellcheck and shfmt on shell scripts

receivers:
  - name: lint
    builtin: true
    type: LintReceiver
    description: Shell linting primitives

commands:
  - name: lint.shell
    help: Run shellcheck and shfmt on shell scripts
    implementation: commands/lint-shell.star
    flags:
      - name: path
        type: string
        default: "."
        help: Path to lint
      - name: severity
        type: string
        default: "warning"
        help: Minimum shellcheck severity (error, warning, info, style)
      - name: indent
        type: int
        default: "4"
        help: Expected indent size for shfmt

config:
  path: lint.shell
  type: ShellLintConfig
  fields:
    path: string
    severity: string
    indent: int
  defaults:
    path: "."
    severity: "warning"
    indent: 4
