extension: com.noblefactor.star.LintGoStyle
description: Enforce Go style guidelines with pluggable rules

receivers:
  - name: goast
    builtin: true
    type: goast.Provider
    description: Go AST operations
  - name: file
    builtin: true
    type: FileReceiver
    description: Filesystem operations
  - name: regexp
    builtin: true
    type: RegexpReceiver
    description: Regular expression operations
  - name: config
    builtin: true
    type: ConfigReceiver
    description: Configuration access

commands:
  - name: lint.go-style
    help: Enforce Go style guidelines (pluggable rule engine)
    implementation: commands/lint-go-style.star
    flags:
      - name: fix
        type: bool
        default: "false"
        help: Rewrite files to fix violations
      - name: path
        type: string
        default: "."
        help: Root directory to scan
      - name: exclude
        type: string
        default: ""
        help: Comma-separated glob patterns to exclude
      - name: generated
        type: bool
        default: "true"
        help: Include generated files (DO NOT EDIT)
      - name: tests
        type: bool
        default: "true"
        help: Include test files (_test.go)
      - name: rule
        type: string
        default: ""
        help: Run only this rule
      - name: verbose
        type: bool
        default: "false"
        help: Print each file as it is checked

config:
  path: lint.go_style
  type: GoStyleConfig
  fields:
    enabled: bool
    line_width: int
    exclude: "[]string"
    disabled_rules: "[]string"
    comment_schemas: "map[string]CommentSchema"
  nested:
    CommentSchema:
      fields:
        format: string
        node_type: string
        elements: "[]SchemaElement"
    SchemaElement:
      fields:
        name: string
        type: string
        required: string
        cardinality: string
        order: int
        header: string
        item_tokens: string
  defaults:
    enabled: true
    line_width: 120
    exclude:
      - "**/vendor/**"
      - "**/testdata/**"
    disabled_rules: []
    comment_schemas:
      copyright:
        format: go
        node_type: File
        elements:
          - name: spdx
            type: verbatim
            required: "true"
            order: 1
          - name: copyright
            type: verbatim
            required: "true"
            order: 2
      gen_decl:
        format: go
        node_type: GenDecl
        elements:
          - name: summary
            type: paragraph
            required: "true"
            order: 1
          - name: body
            type: block
            cardinality: "*"
            order: 2
      func_doc:
        format: go
        node_type: FuncDecl
        elements:
          - name: summary
            type: paragraph
            required: "true"
            order: 1
          - name: body
            type: block
            cardinality: "*"
            order: 2
