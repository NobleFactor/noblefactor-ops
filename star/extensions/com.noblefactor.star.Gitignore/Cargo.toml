[package]
name = "gitignore"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Gitignore pattern matching extension using BurntSushi's ignore crate"

[lib]
crate-type = ["cdylib"]

[dependencies]
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
