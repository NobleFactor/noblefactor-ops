# SPDX-License-Identifier: Apache-2.0
name: CI

# This repository holds the organization's standards -- the PR script template, the Go style
# guidelines, the branch-protection policy, and the plan template CLAUDE.md mandates -- plus the
# architecture and plan records of the star work that moved to devlore-cli in March 2026. It builds
# nothing. The gate is therefore what a documents repository can actually assert: that the
# frontmatter is well formed against the standard this repository itself defines, and that the prose
# is not misspelled.
#
# The job name must stay `quality-gate`. Organization ruleset 12426847 requires that context on every
# repository, so renaming it would leave a required check that never arrives -- which blocks every
# pull request rather than none.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Enforces docs/documentation-standards.md, which this repository defines for the whole
      # organization. Two document families, one rule: a document declaring `type` is a catalogue
      # document and takes decision statuses; one without is a working document and takes the
      # lifecycle statuses from docs/plans/TEMPLATE.md.
      - name: Frontmatter
        run: ./.github/scripts/Test-Frontmatter.sh

      # Prose is the product here. codespell has a low false-positive rate; new exceptions go in
      # .github/codespell-ignore, one word per line.
      - name: Spelling
        uses: codespell-project/actions-codespell@v2
        with:
          ignore_words_file: .github/codespell-ignore
          skip: ./.git,*.svg,*.wasm,*.lock
