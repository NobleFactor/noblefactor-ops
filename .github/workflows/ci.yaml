# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/NobleFactor/*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          owner: NobleFactor
          repositories: devlore-cli

      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Install lint tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          sudo apt-get update && sudo apt-get install -y shellcheck
          golangci-lint version

      - name: Lint Go
        run: go run ./cmd/star lint go

      - name: Test
        run: go test ./... -timeout 60s

      - name: Lint Shell
        run: go run ./cmd/star lint shell

      - name: Code metrics
        run: |
          go install github.com/boyter/scc/v3@latest
          scc --count-as "star:Python" .
