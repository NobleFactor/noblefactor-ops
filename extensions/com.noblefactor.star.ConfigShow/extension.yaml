extension: com.noblefactor.star.ConfigShow
description: Show merged configuration from star.yaml hierarchy

receivers:
  - name: config
    builtin: true
    type: ConfigReceiver
    description: Configuration access
    functions:
      show: Show config with sources

commands:
  - name: config.show
    help: Show merged configuration from star.yaml hierarchy
    implementation: commands/config-show.star
