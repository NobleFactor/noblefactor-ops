extension: lint.markdown
description: Run markdownlint and frontmatter check

receivers:
  - name: lint
    builtin: true
    type: LintReceiver
    description: Markdown linting primitives
    functions:
      markdown: Run markdownlint with frontmatter validation
      ensure_tools: Check lint tool availability
  - name: config
    builtin: true
    type: ConfigReceiver
    description: Configuration access
    functions:
      sync: Sync tool configs

command:
  help: Run markdownlint and frontmatter check on markdown files
  implementation: lint-markdown.star

flags:
  - name: path
    type: string
    default: "."
    help: Path to lint
  - name: fix
    type: bool
    default: "false"
    help: Auto-fix issues where possible
