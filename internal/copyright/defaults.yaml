#
# Default language definitions for copyright header checking.
# These can be overridden in ~/.config/star/config.yaml or .star.yaml

# Default settings
defaults:
  license: "auto"
  holder: ""
  year: "auto"
  include:
    - "**/*"
  exclude:
    - ".git/**"
    - "vendor/**"
    - "node_modules/**"
    - "**/*.min.js"
    - "**/*.min.css"
    - "**/*.generated.*"
    - "**/testdata/**"
    # Config files typically don't need copyright headers
    - "**/.star.yaml"
    - "**/star.yaml"
    - "**/.*.yaml"
    - "**/go.mod"
    - "**/go.sum"
    - "**/package.json"
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/Cargo.lock"
    - "**/.gitignore"
    - "**/.gitattributes"
    - "**/LICENSE*"
    - "**/CHANGELOG*"
    - "**/README*"

# Language definitions
languages:
  # ============================================================================
  # Hash comment languages (#)
  # ============================================================================
  shell:
    extensions: [".sh", ".bash", ".zsh", ".ksh"]
    filenames: ["Makefile", "GNUmakefile", "Dockerfile", "Containerfile", ".envrc"]
    shebangs:
      - '^#!.*/bin/(ba|z|k)?sh'
      - '^#!.*/usr/bin/env\s+(ba|z|k)?sh'
    comment:
      line: "#"
      block: null
    header: |
      # SPDX-License-Identifier: {{.License}}
      # Copyright {{.Holder}}. All rights reserved.
    match:
      spdx: '^#\s*SPDX-License-Identifier:\s*(\S+)'
      copyright: '^#\s*Copyright\s+([^.]+)'

  python:
    extensions: [".py", ".pyw", ".pyi"]
    filenames: []
    shebangs:
      - '^#!.*python[0-9.]*'
      - '^#!.*/usr/bin/env\s+python'
    comment:
      line: "#"
      block: ['"""', '', '"""']
    header: |
      # SPDX-License-Identifier: {{.License}}
      # Copyright {{.Holder}}. All rights reserved.
    match:
      spdx: '^#\s*SPDX-License-Identifier:\s*(\S+)'
      copyright: '^#\s*Copyright\s+([^.]+)'

