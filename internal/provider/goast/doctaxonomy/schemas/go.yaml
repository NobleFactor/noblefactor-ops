schemas:
  copyright:
    format: go
    node_type: File
    elements:
      - name: spdx
        type: verbatim
        required: true
        order: 1
      - name: copyright
        type: verbatim
        required: true
        order: 2

  gen_decl:
    format: go
    node_type: GenDecl
    elements:
      - name: summary
        type: paragraph
        required: true
        order: 1
      - name: body
        type: block
        cardinality: "*"
        order: 2

  func_doc:
    format: go
    node_type: FuncDecl
    elements:
      - name: summary
        type: paragraph
        required: true
        order: 1
      - name: body
        type: block
        cardinality: "*"
        order: 2
