schemas:
  copyright:
    format: go
    node_type: File
    elements:
      - name: spdx
        type: verbatim
        required: true
        order: 1
      - name: copyright
        type: verbatim
        required: true
        order: 2

  gen_decl:
    format: go
    node_type: GenDecl
    elements:
      - name: summary
        type: paragraph
        required: true
        order: 1
      - name: body
        type: block
        cardinality: "*"
        order: 2

  func_doc:
    format: go
    node_type: FuncDecl
    elements:
      - name: summary
        type: paragraph
        required: true
        order: 1
      - name: body
        type: block
        cardinality: "*"
        order: 2
      - name: parameters
        type: param_section
        required: if_params
        order: 3
        header: "Parameters:"
        item_tokens: param_names
      - name: returns
        type: return_section
        required: if_returns
        order: 4
        header: "Returns:"
        item_tokens: return_types
      - name: directives
        type: directive
        cardinality: "*"
        order: 5
