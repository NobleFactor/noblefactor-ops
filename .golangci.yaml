# SPDX-License-Identifier: MIT
# golangci-lint v2 configuration for NobleFactor Go projects
#
# Objectives:
#   - Low complexity (gocyclo <= 15, gocognit <= 20)
#   - No dead or unused code
#   - No redundant code
#   - Clean formatting
#
# Copy this file to any Go repo root.

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    # Essential
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused

    # Complexity
    - gocyclo
    - gocognit

    # Dead/redundant code
    - unparam
    - unconvert

    # Code quality
    - gocritic
    - gosec
    - misspell
    - nilerr
    - bodyclose
    - durationcheck
    - errorlint
    - noctx

    # Style
    - revive
    - whitespace

  settings:
    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - whyNoLint
        - hugeParam

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: var-naming

    gosec:
      excludes:
        - G104   # Audit errors not checked
        - G204   # Subprocess launched with variable - intentional for linting tools
        - G301   # Directory permissions 0755 - needed for executable dirs
        - G302   # File permissions 0755 - needed for executables
        - G304   # File inclusion via variable
        - G306   # File write permissions 0644 - standard for config files

    misspell:
      locale: US

    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - io.Copy
        - (*os.File).Close
        - (io.Closer).Close

  exclusions:
    generated: lax
    rules:
      # Test files can have higher complexity
      - path: _test\.go
        linters:
          - gocyclo
          - gocognit
          - errcheck
          - gosec

      # Generated files
      - path: \.pb\.go$
        linters:
          - all

      # AST parsing routines are inherently complex
      - path: internal/starlark/builtin_go\.go
        linters:
          - gocyclo
          - gocognit

      - path: internal/starlark/builtin_shell\.go
        linters:
          - gocyclo
          - gocognit

      - path: internal/starlark/builtin_starlark_parse\.go
        linters:
          - gocyclo
          - gocognit

      - path: internal/starlark/devlore/api\.go
        linters:
          - gocyclo
          - gocognit

      # Type names in internal package - renaming would break existing usage
      - path: internal/starlark/builtin_starlark_parse\.go
        linters:
          - revive
        text: "type name will be used as"

    paths:
      - vendor
      - testdata
      - .git

output:
  formats:
    text:
      path: stdout
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
