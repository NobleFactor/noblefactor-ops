extension: com.noblefactor.ops.GitHub
description: GitHub under the NobleFactor classification scheme -- the issue report and audit, and the label set

commands:
  - name: gh.issues.report
    help: Render the epic / feature / task tree from GitHub issues, by epic, across the configured repositories
    implementation: commands/gh-issues-report.star
    flags:
      - name: by
        type: string
        default: "epic"
        help: Section the report by epic, by feature (one row per feature with its counts and state), by thread, or by schedule (lanes in declared order, progress derived)
      - name: view
        type: string
        default: "table"
        help: tree or table
      - name: epic
        type: string
        default: ""
        help: Report one epic, by the Name in its Epic:<Name> label
      - name: thread
        type: string
        default: ""
        help: Report one thread, by the Name in its Thread:<Name> label
      - name: schedule
        type: string
        default: ""
        help: Report one schedule, by the name after 'Schedule:' in its title
      - name: state
        type: string
        default: ""
        help: open, closed, or all; defaults to open by epic and to all by feature, thread, and schedule
      - name: limit
        type: int
        default: "500"
        help: Most issues to fetch
      - name: repo
        type: string
        default: ""
        help: Repositories to report on, owner/name, comma-separated; overrides gh.repositories in star/config.yaml
      - name: directory
        type: string
        default: ""
        help: A working tree; the report targets the repository its origin names
      - name: markdown
        type: bool
        default: "false"
        help: Return the markdown document Get-EpicReport prints, as one string (render with -o value)

  - name: gh.issues.audit
    help: Every open issue the classification scheme cannot place, with the fault
    implementation: commands/gh-issues-audit.star
    flags:
      - name: unthreaded
        type: bool
        default: "false"
        help: "Instead of the classification audit, list open tasks, bugs and chores carrying no Thread: label, grouped by epic and feature; a question, not a fault"
      - name: epic
        type: string
        default: ""
        help: "With --unthreaded, narrow to one epic by the Name in its Epic:<Name> label"
      - name: limit
        type: int
        default: "500"
        help: Most issues to fetch
      - name: repo
        type: string
        default: ""
        help: Repositories to audit, owner/name, comma-separated; overrides gh.repositories in star/config.yaml
      - name: directory
        type: string
        default: ""
        help: A working tree; the audit targets the repository its origin names
      - name: markdown
        type: bool
        default: "false"
        help: Return the audit section Get-EpicReport prints, as one string (render with -o value)

  - name: gh.labels.audit
    help: Which configured repositories lack a kind, Epic:Ops:Process, or a thread label, and which carry one that has drifted
    implementation: commands/gh-labels-audit.star
    flags:
      - name: repo
        type: string
        default: ""
        help: Repositories to audit, owner/name, comma-separated; overrides gh.repositories in star/config.yaml
      - name: directory
        type: string
        default: ""
        help: A working tree; the audit targets the repository its origin names
      - name: markdown
        type: bool
        default: "false"
        help: Return the audit as a document, one string (render with -o value)

  - name: gh.labels.sync
    help: Create the labels the audit reports missing and align the ones that drifted; never deletes; honours --dry-run
    implementation: commands/gh-labels-sync.star
    flags:
      - name: repo
        type: string
        default: ""
        help: Repositories to sync, owner/name, comma-separated; overrides gh.repositories in star/config.yaml
      - name: directory
        type: string
        default: ""
        help: A working tree; the sync targets the repository its origin names

config:
  path: gh
  type: GitHubConfig
  fields:
    repositories: "[]string"
    exempt: "[]int"
  defaults:
    repositories: []
    exempt: []
